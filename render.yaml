# render.yaml
services:
  - type: web
    name: docmind-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false # Render will prompt you to enter your Neon database URL
      - key: GROQ_API_KEY
        sync: false # Render will prompt you to enter your Groq API key
      - key: JWT_SECRET
        sync: false # Render will prompt you to enter your JWT Secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: DEBUG
        value: False
